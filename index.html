<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        var key = "echo-color-theme";
        var theme = "dark";
        try {
          var saved = localStorage.getItem(key);
          if (saved === "dark" || saved === "light") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f4f2ea" : "#121212");
        var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (apple) apple.setAttribute("content", theme === "light" ? "default" : "black-translucent");
      })();
    </script>
