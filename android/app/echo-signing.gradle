// Release signing for com.ayk.echo. Passwords come from the environment or from
// android/keystore/keystore.properties (gitignored). See docs/android.md.

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}

def echoStoreFile = System.getenv("ECHO_KEYSTORE_FILE") ?: keystoreProperties.getProperty("storeFile") ?: "keystore/echo-release.keystore"
def echoStorePassword = System.getenv("ECHO_KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword")
def echoKeyAlias = System.getenv("ECHO_KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias") ?: "echo"
def echoKeyPassword = System.getenv("ECHO_KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword")

def echoSigningReady = echoStorePassword?.trim() && echoKeyPassword?.trim()
def releaseRequested = gradle.startParameter.taskNames.any { name ->
    def task = name.toLowerCase()
    task.contains("release")
}
def resolvedStore = rootProject.file(echoStoreFile)

// Missing passwords must not fail the build. Play upload still needs a signature,
// applied later with the existing keystore (env vars or keystore.properties).
// Never print those passwords.
if (releaseRequested && !echoSigningReady) {
    logger.warn("Release signing credentials are absent (ECHO_KEYSTORE_PASSWORD and ECHO_KEY_PASSWORD, or android/keystore/keystore.properties). assembleRelease and bundleRelease will be UNSIGNED. See docs/android.md.")
}
if (releaseRequested && echoSigningReady && !resolvedStore.isFile()) {
    throw new GradleException("Release signing was requested but the keystore was not found at ${resolvedStore}. Set ECHO_KEYSTORE_FILE or storeFile. Do not commit the keystore.")
}

android {
    signingConfigs {
        release {
            if (echoSigningReady) {
                storeFile resolvedStore
                storePassword echoStorePassword
                keyAlias echoKeyAlias
                keyPassword echoKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (echoSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}
